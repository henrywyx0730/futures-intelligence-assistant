runtime:
  database_path: futures_intelligence.db
  brief:
    lookback_hours: 24
    output_directory: data/briefs
  scheduler:
    enabled: false
    interval_hours: 24
  logging:
    level: INFO
    file_path: logs/futures_intelligence.log
  health:
    file_path: data/health_report.json
  history:
    file_path: data/market_intelligence_history.json
  llm:
    enabled: false
    provider: openai
    model: gpt-5.6-luna
    source_types:
      - research_report
    min_reliability_score: 4
    max_items_per_run: 3
    usage:
      file_path: data/llm_usage.jsonl
    pricing:
      model: gpt-5.6-luna
      effective_date: "2026-07-19"
      input_per_million_usd: 1.00
      cached_input_per_million_usd: 0.10
      output_per_million_usd: 6.00
      cache_write_multiplier: 1.25
